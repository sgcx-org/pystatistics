name: Build, test & publish wheels

on:
  release:
    types: [published]
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  version_consistency:
    # pyproject.toml's version and pystatistics.__version__ must agree, and on
    # a release they must equal the tag. 6.1.4 shipped self-reporting "6.1.3"
    # because only pyproject was bumped; this job makes that impossible.
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare pyproject, __init__, and (on release) the tag
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib
          v_toml = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          v_init = re.search(r'__version__ = "([^"]+)"',
                             open("pystatistics/__init__.py").read()).group(1)
          problems = []
          if v_toml != v_init:
              problems.append(f"pyproject {v_toml} != __init__ {v_init}")
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/").lstrip("v")
              if tag != v_toml:
                  problems.append(f"tag {tag} != pyproject {v_toml}")
          if problems:
              sys.exit("version mismatch: " + "; ".join(problems))
          print(f"version consistent: {v_toml}")
          PY

  build_wheels:
    name: wheels · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Launch matrix: glibc-Linux + macOS arm64 + Windows x64.
        #   ubuntu-latest  -> manylinux glibc x86_64
        #   macos-15       -> arm64
        #   windows-latest -> win_amd64 (MSVC; /fp:precise, no FMA on baseline x64)
        # Intel macOS (macos-13 / x86_64) is intentionally excluded: Apple has
        # EOL'd Intel Macs and GitHub is deprecating the runners (they queue for
        # hours). Its numerics are already covered by macos-15 (same clang+libm).
        # musl (Alpine) remains out — added later only on demand.
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        # Pin exactly once the current release is confirmed in CI.
        run: python -m pip install cibuildwheel

      - name: Build and test wheels
        # cibuildwheel reads [tool.cibuildwheel] in pyproject.toml, builds each
        # wheel through the hatchling hook (-ffp-contract=off), and runs the
        # bit-identity + R-parity tests INSIDE each wheel before accepting it.
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist

      - name: Verify sdist builds from source (compiler present)
        # The sdist has no wheel guarantee off-matrix; here we confirm it DOES
        # build where a C compiler exists (proposal §11 Q3 = hard-fail otherwise).
        run: python -m pip install dist/*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [version_consistency, build_wheels, build_sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
